# Publication d'une version, déclenchée par un tag.
#
# Chaque cible se construit sur sa plateforme : MSVC sous Windows, la chaîne GNU
# sous Linux. Jamais le poste de travail, qui n'offre aucune garantie de
# reproductibilité.
#
# La release est créée en brouillon : les notes disent ce que le numéro ne dit
# pas — un changement de SCG_ABI_VERSION, de version_format, du rendu — et ça
# demande un jugement qu'aucun générateur ne remplace. Relire, publier.
#
# Actions épinglées au SHA, pour la même raison que dans ci.yml : un tag de
# majeure est mobile, et celles-ci s'exécutent avec les droits d'écriture du
# dépôt.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lu avant toute construction : une section absente arrête la publication, et
  # autant le savoir avant de compiler. Une version sans notes ne dit ni ce qui
  # change, ni ce qu'un auteur de liaison doit reprendre.
  notes:
    name: Notes et version
    runs-on: ubuntu-latest
    outputs:
      titre: ${{ steps.notes.outputs.titre }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Le tag et la version du Cargo.toml disent la même chose, ou rien ne part :
      # une bibliothèque publiée sous v0.1.0 qui se déclare 0.0.0 ment à chaque
      # outil qui lit ses métadonnées.
      - name: Vérifier la version du Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          declaree=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$declaree" != "$version" ]; then
            echo "Cargo.toml déclare $declaree, le tag est $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Lire les notes dans le CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"

          # index et non une expression régulière : les crochets du titre de
          # section formeraient une classe de caractères, et « [0.4.0] » ne
          # désignerait plus qu'un seul caractère.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { dedans = 1; next }
            dedans && index($0, "## ") == 1 { exit }
            dedans { print }
          ' CHANGELOG.md > notes.md

          # Une section faite de lignes vides passerait un test de taille : c'est
          # du texte qui est exigé, pas des octets.
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md n'a pas de section pour la version $version" >&2
            exit 1
          fi

          # Le titre est la troisième partie du titre de section, après la
          # version et la date. Absent, la release se nomme par son tag seul.
          titre=$(grep -m1 -F "## [$version]" CHANGELOG.md \
            | sed -n 's/^## \[[^]]*\][^—]*—[^—]*— *//p')
          echo "titre=${GITHUB_REF_NAME}${titre:+ — $titre}" >> "$GITHUB_OUTPUT"
          cat notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes.md

  bibliotheque:
    name: Bibliothèque — ${{ matrix.cible }}
    needs: notes
    runs-on: ${{ matrix.os }}
    # `construire` et `repertoire` parce que le module wasm a sa propre cible et
    # son propre profil : le panic = "unwind" de release-ffi y serait ignoré.
    strategy:
      matrix:
        include:
          - os: windows-latest
            cible: windows_x64
            construire: make lib
            repertoire: target/release-ffi
            fichiers: screengine.dll screengine.dll.lib screengine.lib
          - os: windows-latest
            cible: windows_x86
            construire: make lib CIBLE_LIB=i686-pc-windows-msvc
            repertoire: target/i686-pc-windows-msvc/release-ffi
            fichiers: screengine.dll screengine.dll.lib screengine.lib
          - os: ubuntu-latest
            cible: linux_x64
            construire: make lib
            repertoire: target/release-ffi
            fichiers: libscreengine.so libscreengine.a
          - os: ubuntu-latest
            cible: linux_x86
            construire: make lib CIBLE_LIB=i686-unknown-linux-gnu
            repertoire: target/i686-unknown-linux-gnu/release-ffi
            fichiers: libscreengine.so libscreengine.a
          - os: ubuntu-latest
            cible: wasm32
            construire: make lib-wasm
            repertoire: target/wasm32-unknown-unknown/release-wasm
            fichiers: screengine.wasm
          # Une entrée `abi:triple` range la bibliothèque de ce triple sous
          # lib/<abi>/, la disposition de jniLibs/ qu'un projet Android reprend
          # telle quelle.
          - os: ubuntu-latest
            cible: android
            construire: make lib-android
            repertoire: target
            fichiers: arm64-v8a:aarch64-linux-android armeabi-v7a:armv7-linux-androideabi x86_64:x86_64-linux-android
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaîne Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: GNU Make
        if: runner.os == 'Windows'
        run: choco install make --no-progress

      # make test lance l'hôte wasm, sur chaque entrée de la matrice.
      - name: Cible wasm
        run: rustup target add "$(make -s print-CIBLE_WASM)"

      # Les deux cibles bureau 32 bits. Sous Linux, l'édition de liens d'une
      # bibliothèque i686 réclame les bibliothèques C 32 bits, que l'image
      # n'installe pas ; sous Windows, MSVC les porte déjà.
      - name: Cible 32 bits
        if: endsWith(matrix.cible, '_x86')
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q gcc-multilib
            rustup target add i686-unknown-linux-gnu
          else
            rustup target add i686-pc-windows-msvc
          fi

      # L'hôte Android, comme dans ci.yml : NDK, build-tools et plateforme aux
      # versions de son Makefile, qemu-user, et KVM pour l'émulateur.
      - name: Android
        if: matrix.cible == 'android'
        run: |
          [ -e /dev/kvm ] || { echo "KVM absent du runner" >&2; exit 1; }
          sudo chmod 666 /dev/kvm
          sudo apt-get update -q && sudo apt-get install -y -q qemu-user
          rustup target add $(make -s print-CIBLES_ANDROID)
          version() { make -s --no-print-directory -C hosts/android print-$1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$(version NDK_VERSION)" "build-tools;$(version BUILD_TOOLS)" \
            "platforms;$(version PLATFORM)" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(version NDK_VERSION)" >> "$GITHUB_ENV"
          # Le niveau seul, dérivé de la plateforme : voir ci.yml.
          echo "API_LEVEL=$(version PLATFORM | sed 's/^android-//')" >> "$GITHUB_ENV"

      # ci.yml n'écoute que les branches et les PR : sans ce garde-fou, un tag
      # posé sur un commit rouge publierait quand même. La conformance en fait
      # partie — une bibliothèque qui ne rend pas les empreintes de référence
      # n'est pas celle que les notes décrivent.
      #
      # L'hôte Android tourne une fois, sur l'entrée qui publie sa bibliothèque,
      # émulateur démarré. Les autres entrées le retirent : Windows n'a pas
      # d'émulateur, et le repasser sous Linux ne vérifierait rien de plus.
      - name: Tests et conformance
        if: matrix.cible == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: make test && make conform

      - name: Tests et conformance
        if: matrix.cible != 'android'
        run: make test SANS=android && make conform

      # Sur l'architecture qu'on publie, et non seulement sur celle du runner.
      # Redit ce que ci.yml vérifie déjà, et pour la même raison que le reste de
      # ce garde-fou : ci.yml n'écoute pas les tags.
      - name: Conformance sur la cible publiée
        if: endsWith(matrix.cible, '_x86')
        run: |
          cible=$([ "$RUNNER_OS" = Linux ] && echo i686-unknown-linux-gnu \
                                           || echo i686-pc-windows-msvc)
          make conform-x86 CIBLE_X86="$cible"

      # Par le Makefile et non cargo build : c'est lui qui porte le profil —
      # release-ffi, sans lequel catch_unwind ne rattraperait rien, ou
      # release-wasm.
      - name: Construire
        run: ${{ matrix.construire }}

      # Le nom de l'archive porte version, système et architecture : c'est ce
      # qui permet de choisir son fichier et d'en garder deux versions côte à
      # côte. Les deux licences vont dans l'archive et non à côté : personne ne
      # télécharge un asset séparé pour accompagner une bibliothèque.
      - name: Empaqueter
        run: |
          paquet="screengine_${GITHUB_REF_NAME}_${{ matrix.cible }}"
          mkdir -p "paquets/$paquet/lib" "paquets/$paquet/include" publication
          for fichier in ${{ matrix.fichiers }}; do
            case "$fichier" in
              *:*)
                mkdir -p "paquets/$paquet/lib/${fichier%%:*}"
                cp "${{ matrix.repertoire }}/${fichier#*:}/release-ffi/libscreengine.so" "paquets/$paquet/lib/${fichier%%:*}/" ;;
              *)
                cp "${{ matrix.repertoire }}/$fichier" "paquets/$paquet/lib/" ;;
            esac
          done
          cp include/screengine.h "paquets/$paquet/include/"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES "paquets/$paquet/"

          # Zip sous Windows, tar.gz ailleurs : ce que chaque système ouvre sans
          # rien installer.
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd paquets && 7z a -tzip -bso0 "../publication/$paquet.zip" "$paquet")
          else
            tar -czf "publication/$paquet.tar.gz" -C paquets "$paquet"
          fi
          echo "PAQUET=paquets/$paquet" >> "$GITHUB_ENV"

      # Pas l'émulateur une seconde fois : ce que l'archive peut cacher et que
      # les tests ne voient pas, c'est un `.so` d'une autre architecture rangé
      # sous la mauvaise ABI, ou un alignement de pages qui refuse l'appareil.
      # Les deux se lisent dans l'en-tête ELF, sans rien exécuter.
      - name: Éprouver l'archive Android
        if: matrix.cible == 'android'
        run: |
          declare -A machine=( [arm64-v8a]=AArch64 [armeabi-v7a]=ARM [x86_64]=Advanced )
          for abi in "${!machine[@]}"; do
            so="$PAQUET/lib/$abi/libscreengine.so"
            readelf -h "$so" | grep -q "${machine[$abi]}" \
              || { echo "$abi : mauvaise architecture" >&2; exit 1; }
            readelf -d "$so" | grep -q 'SONAME.*\[libscreengine.so\]' \
              || { echo "$abi : SONAME absent" >&2; exit 1; }
            # 16 Ko sur les ABI 64 bits, que le NDK r29 aligne sans option ;
            # armv7 reste à 4 Ko, et c'est attendu — les pages de 16 Ko
            # n'existent que sur les appareils 64 bits.
            attendu=$([ "$abi" = armeabi-v7a ] && echo 0x1000 || echo 0x4000)
            readelf -l "$so" | grep -q "$attendu" \
              || { echo "$abi : alignement autre que $attendu" >&2; exit 1; }
            echo "archive Android, $abi : architecture, SONAME et alignement"
          done

      # L'archive elle-même, pas l'arbre de construction : les hôtes que son
      # contenu permet de lier — C contre la bibliothèque statique, C++ contre
      # la dynamique, Node contre le module wasm — doivent rendre les empreintes
      # du chemin Rust. C'est la seule preuve qu'un intégrateur qui ouvre
      # l'archive obtient une bibliothèque qui se lie, se charge sous son nom et
      # rend la même image. Le module publié passe d'ailleurs par un profil que
      # `make test` n'emprunte pas, le seul à porter `strip = true` : un export
      # emporté au passage ne se verrait sinon que chez lui.
      #
      # `make test-archive` et non les commandes ici : la liste des scènes, les
      # fichiers qu'elles chargent et la façon de lier chaque hôte vivent dans
      # le Makefile. Recopiées ici, elles divergeaient — deux fois, et chaque
      # fois l'échec n'est apparu qu'au tag, cette étape ne tournant nulle part
      # ailleurs.
      - name: Éprouver l'archive
        if: matrix.cible != 'android' && !endsWith(matrix.cible, '_x86')
        run: make test-archive PAQUET="$PAQUET"

      # Les hôtes ne se lient pas contre une bibliothèque 32 bits sans une
      # seconde chaîne C pour cette architecture, que ni l'un ni l'autre runner
      # n'a. L'archive s'éprouve donc comme celle d'Android, par ce qui se lit
      # sans exécuter : l'architecture annoncée dans l'en-tête du binaire. Ce
      # qu'elle attrape est la seule erreur que la matrice puisse commettre ici
      # — un répertoire de construction qui aurait rangé le binaire 64 bits
      # sous le nom du paquet 32.
      - name: Éprouver l'archive 32 bits
        if: endsWith(matrix.cible, '_x86')
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            readelf -h "$PAQUET/lib/libscreengine.so" | grep -q 'Intel 80386' \
              || { echo "la bibliotheque n'est pas en i386" >&2; exit 1; }
          else
            # L'en-tête COFF d'un PE : son décalage se lit en 0x3C, et le champ
            # Machine quatre octets plus loin. 014c est i386, 8664 x86-64.
            dll="$PAQUET/lib/screengine.dll"
            pe=$((0x$(od -An -t x4 -j 60 -N 4 "$dll" | tr -d ' ')))
            machine=$(od -An -t x2 -j $((pe + 4)) -N 2 "$dll" | tr -d ' ')
            [ "$machine" = 014c ] \
              || { echo "machine $machine, attendu 014c (i386)" >&2; exit 1; }
          fi
          echo "archive 32 bits : architecture du binaire verifiee"

      # Ce que les empreintes ne disent pas : sous quel nom la bibliothèque se
      # charge. Un SONAME absent, et l'exécutable de l'intégrateur réclame le
      # chemin de construction au lieu de `libscreengine.so`.
      - name: Nom de chargement de la bibliothèque
        if: matrix.cible == 'linux_x64'
        run: |
          readelf -d "$PAQUET/lib/libscreengine.so" | grep -q 'SONAME.*\[libscreengine.so\]'
          readelf -d "$(make -s print-ARCHIVE_OUT)/cpp/screengine-cpp" | grep -q 'NEEDED.*\[libscreengine.so\]'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.cible }}
          path: publication/*

  publication:
    name: Brouillon de release
    needs: [notes, bibliotheque]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # L'attestation lie l'archive au commit et au workflow qui l'a produite,
      # et se vérifie avec `gh attestation verify`. C'est le seul contrepoids
      # crédible à des bibliothèques non signées, chargées dans le processus de
      # l'hôte.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: telecharge

      - name: Rassembler
        run: |
          mkdir -p publication
          cp telecharge/archive-*/* publication/
          cp telecharge/notes/notes.md .
          cd publication
          # Sur les archives et non sur les bibliothèques : c'est l'archive que
          # la personne télécharge, donc ce qu'elle peut vérifier.
          sha256sum screengine_* > SHA256SUMS
          ls -la

      - name: Attester la provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'publication/screengine_*'

      # gh est préinstallé sur le runner : pas d'action tierce à épingler pour
      # une opération que la ligne de commande fait aussi bien.
      - name: Créer la release en brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "${{ needs.notes.outputs.titre }}" \
            --notes-file notes.md \
            publication/*
