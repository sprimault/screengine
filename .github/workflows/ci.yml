# Intégration continue.
#
# Les actions sont épinglées au SHA, le tag lisible en commentaire. Un tag de
# majeure comme `@v7` est mobile : il désigne un contenu qui change sans que ce
# dépôt bouge, donc du code tiers exécuté avec nos droits. Le SHA ne se réécrit
# pas. Contrepartie assumée : relever les versions est une opération manuelle.
#
# Tout passe par le Makefile, comme en local. Une commande cargo écrite ici
# serait une seconde définition du contrôle, et c'est celle qu'on ne peut pas
# essayer avant de pousser.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # L'audit doit tourner même quand personne ne contribue : un avis publié en
  # amont n'attend pas la prochaine PR.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# **Chaque job porte un plafond de temps**, parce que le défaut est de six
# heures : une étape qui pend n'échoue pas, elle se tait, et personne ne la
# remarque avant d'aller voir. Arrivé sur une installation réseau, un
# `apt-get update` arrêté en silence pendant trente-deux minutes.
#
# Les plafonds sont calibrés sur ce que les jobs prennent — onze minutes pour le
# plus long, émulateur Android compris —, avec de quoi absorber un runner lent
# sans laisser passer un blocage. Un job qui les atteint signale une panne,
# jamais une charge.
#
# **Trop large, un plafond ne sert à rien** : à quarante minutes, le blocage de
# trente-deux qu'on a vu serait passé dessous sans rien dire. C'est pourquoi
# l'étape qui télécharge en porte un propre, bien plus court que celui de son
# job.
jobs:
  verification:
    name: Format, lint, no_std, header, licences
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaîne Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # cbindgen et cargo-deny se compilent depuis les sources : plusieurs
      # minutes à chaque exécution sans cache. La clé suit le Makefile, qui porte
      # les versions épinglées : une version relevée invalide le cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: outils-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Outils
        run: make tools

      - name: Format
        run: make fmt

      - name: Lint
        run: make lint

      # Sur une cible sans std : c'est la seule forme du contrôle qui échoue
      # vraiment sur un `use std::` glissé dans le noyau.
      - name: no_std
        run: make nostd

      # Un écart signale une édition manuelle du header ou une régénération
      # oubliée. Les deux se paient chez l'intégrateur.
      - name: Header
        run: make header-verif

      # Le nom de ce job ne dit pas la documentation, et c'est volontaire : il est
      # un contrôle requis de la branche par son nom exact, que le renommer
      # rendrait introuvable.
      - name: Documentation
        run: make doc-verif

      # La version minimale que `Cargo.toml` déclare et que `CONTRIBUTING`
      # reprend : tout le reste se construit avec une chaîne récente, et une
      # fonction stabilisée depuis passerait sans bruit jusqu'à ce que quelqu'un
      # ouvre le dépôt avec la chaîne annoncée. Une étape de ce job plutôt qu'un
      # job à part : la protection de branche exige les contrôles par leur nom,
      # et un job nouveau échouerait sans rien bloquer tant qu'il n'y est pas.
      - name: Version minimale
        run: make msrv

      - name: Licences et provenance
        run: make deny

  # Les empreintes de référence sont versionnées : chaque plateforme les compare
  # aux mêmes fichiers, donc toutes les plateformes entre elles. Une conformance
  # qui ne tournerait que sur une plateforme ne comparerait rien.
  tests:
    name: Tests et conformance — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Le plus large des trois : il démarre un émulateur Android, puis rejoue
    # tout sous qemu et sous Node. Mesuré à onze minutes, émulateur compris.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaîne Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # L'image Windows fournit bash mais pas GNU Make.
      - name: GNU Make
        if: runner.os == 'Windows'
        run: choco install make --no-progress

      # L'hôte wasm de make test tourne sous Node, que les deux images
      # fournissent. Il lui faut la cible, que ce job n'installe pas par
      # make tools : recompiler les outils ici ne servirait qu'au lint.
      - name: Cible wasm
        run: |
          rustup target add "$(make -s print-CIBLE_WASM)"
          node --version

      # Go et son compilateur C : les deux images en portent un, et l'étape ne
      # fait que le dire. Une version absente échouerait ici plutôt qu'en faisant
      # sauter l'hôte au milieu de `make test`.
      - name: Go
        run: |
          go version
          cc --version | head -1 || gcc --version | head -1

      # L'hôte Android : NDK, build-tools et plateforme aux versions du Makefile
      # de l'hôte, qemu-user pour les ABI ARM, et KVM pour l'émulateur. L'image
      # expose /dev/kvm, mais pas à l'utilisateur du job : ouvert le temps du
      # job, plutôt que par une règle udev dont l'image n'a plus le répertoire.
      # Un plafond propre à cette étape, en plus de celui du job : c'est elle
      # qui télécharge, donc celle qui pend, et le dire ici nomme la panne au
      # lieu de laisser le job entier expirer sans raison affichée.
      - name: Android
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          [ -e /dev/kvm ] || { echo "KVM absent du runner" >&2; exit 1; }
          sudo chmod 666 /dev/kvm
          sudo apt-get update -q && sudo apt-get install -y -q qemu-user
          rustup target add $(make -s print-CIBLES_ANDROID)
          version() { make -s --no-print-directory -C hosts/android print-$1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$(version NDK_VERSION)" "build-tools;$(version BUILD_TOOLS)" \
            "platforms;$(version PLATFORM)" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(version NDK_VERSION)" >> "$GITHUB_ENV"
          # L'émulateur veut le niveau seul, la plateforme le porte préfixé.
          # Le dériver plutôt que l'écrire : un émulateur d'un autre niveau que
          # la plateforme installée démarre quand même, et ne teste plus ce
          # qu'on croit.
          echo "API_LEVEL=$(version PLATFORM | sed 's/^android-//')" >> "$GITHUB_ENV"

      # Sous Linux, make test entier tourne une fois l'émulateur démarré : c'est
      # le seul moment où l'hôte Android a un appareil.
      - name: Tests
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: make test

      # Windows n'a ni qemu-user ni KVM pour l'émulateur : l'hôte Android y est
      # retiré par une exclusion écrite, et non par un saut que CI ferait échouer.
      - name: Tests
        if: runner.os == 'Windows'
        run: make test SANS=android

      - name: Conformance
        run: make conform

      # Les mêmes scènes, la même référence, un pointeur deux fois plus court.
      # Sous Windows seulement : la cible s'y lie sans rien installer, là où
      # i686 sous Linux réclamerait gcc-multilib pour vérifier une seconde fois
      # la même propriété. Une divergence 32 bits viendrait de l'architecture,
      # jamais du système.
      - name: Conformance 32 bits
        if: runner.os == 'Windows'
        run: |
          rustup target add "$(make -s print-CIBLE_X86)"
          make conform-x86

      # Les deux ABI ARM, sous qemu-user et sans appareil. En dernier, et sous
      # émulation : un échec y est moins probable que partout ailleurs, et le
      # premier annoncé doit être le plus courant. Hors de l'action émulateur,
      # qui ne leur sert pas — qemu-user exécute des binaires, pas un système.
      - name: Tests du noyau sur ARM
        if: runner.os == 'Linux'
        run: make test-arm

      # Les mêmes scènes et les mêmes empreintes, sur une autre architecture.
      # C'est le seul endroit où les vingt-neuf se comparent hors de x86 : les
      # hôtes n'en portent que quatorze, par le seul chemin que leur machine
      # résout.
      - name: Conformance sur ARM
        if: runner.os == 'Linux'
        run: make conform-arm

      # Les deux cibles Linux sur ARM, sous qemu. Ce qu'elles ont de propre est
      # la **glibc** là où les ABI Android portent la bionic : le noyau n'en
      # emploie aucune, mais la frontière passe par `std`, et c'est la seule
      # chose que ces cibles existent pour éprouver.
      #
      # Les `libc6-dev-*-cross` sont nommés explicitement : sans eux, `gcc-*`
      # croisé est là mais l'édition de liens échoue sur `Scrt1.o` introuvable,
      # un message qui ne nomme pas le paquet qui manque.
      - name: Chaînes croisées Linux ARM
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          rustup target add $(make -s print-CIBLES_LINUX_ARM)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            qemu-user-static

      - name: Tests du noyau et de la frontière sur Linux ARM
        if: runner.os == 'Linux'
        run: make test-linux-arm

      - name: Conformance sur Linux ARM
        if: runner.os == 'Linux'
        run: make conform-linux-arm

      # Le noyau et la conformance sur une cible wasm, exécutés par Node. Sur
      # les deux systèmes, là où les cibles ARM demandent qemu : la cible wasm
      # n'a besoin que de Node, que les deux images portent, et faire tourner
      # les deux dit en plus que l'image ne dépend pas du système hôte.
      - name: Tests du noyau sur wasm
        run: |
          rustup target add "$(make -s print-CIBLE_WASI)"
          make test-wasi

      - name: Conformance sur wasm
        run: make conform-wasi

      # Le paquet que la publication produit, monté puis éprouvé **hors d'un
      # tag**. Sans cette étape, la logique de `make test-archive` — déduire les
      # hôtes de `lib/`, les lier contre le seul contenu du paquet, comparer au
      # chemin Rust — n'était vérifiée que par la publication elle-même, et elle
      # a divergé deux fois sans que rien ne le voie avant la version posée.
      #
      # Ici plutôt que dans la liste d'avant-publication, comme `make msrv` :
      # elle construit en `release-ffi`, dont la LTO complète se paierait à
      # chaque passage local. En dernier, parce qu'elle est la plus lente.
      - name: Paquet de publication
        run: make test-paquet

  # Job distinct : un avis publié en amont n'a rien à voir avec la PR en cours,
  # et son échec ne doit pas se lire comme « ta contribution est cassée ».
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaîne Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: outils-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # cargo-audit n'est pas épinglé : make tools le remet à jour quand une
      # version plus récente existe, cache ou pas.
      - name: Outils
        run: make tools

      - name: Vulnérabilités
        run: make audit
