[package]
name = "screengine-ffi"
description = "Frontière C de Screengine : conversion de types, sans logique."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# `rlib` en plus des deux artefacts publiés : sans lui, `tests/` ne peut pas se
# lier au crate, et les tests de frontière n'existeraient pas.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
screengine.workspace = true

[lints]
workspace = true
