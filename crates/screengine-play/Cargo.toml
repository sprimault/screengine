[package]
name = "screengine-play"
description = "Étage d'accueil de Screengine : fenêtre, entrées, boucle à pas fixe, mise à l'échelle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Sans les fonctionnalités par défaut, pour deux retraits : `kms` de softbuffer,
# qui n'affiche pas dans une fenêtre, et les décorations dessinées de winit sous
# Wayland, qui tirent un rasteriseur vectoriel et des polices pour une barre de
# titre. Tout le reste passe par `dlopen` : la compilation n'exige aucun paquet
# système sous Linux, seule l'exécution en exige.
#
# winit reste en 0.30 : la 0.31 est encore en bêta, exige Rust 1.86, et change
# la forme du gestionnaire d'application.
#
# `png` est ici et pas dans le noyau parce que le moteur n'ouvre aucun fichier :
# il reçoit un bloc de texels et rien d'autre. Un hôte écrit contre l'ABI C
# décode avec ce qu'il a — libpng, `Image` d'Android, `createImageBitmap` du
# navigateur —, et c'est le même travail que fait ce crate pour le chemin Rust.
#
# `web-time` est déjà tiré par winit ; il est déclaré ici parce que
# `ControlFlow::WaitUntil` prend son `Instant` et non celui de `std` dès que la
# cible est wasm. L'emprunter à winit sans le nommer ferait dépendre la
# compilation de l'arbre de quelqu'un d'autre.
[dependencies]
png = "0.18.1"
screengine.workspace = true
softbuffer = { version = "0.4.8", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }
web-time = "1.1.0"
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }

# Sur wasm seulement, et pour le seul puits d'erreur par défaut : rien n'y mène
# la sortie d'erreur à la console du navigateur, et c'est la cible où ce chemin
# est le seul, `run` n'ayant plus de retour à remplir après le lancement. Les
# deux crates sont déjà dans le `Cargo.lock`, tirés par winit sur cette cible.
#
# Ils ne contredisent pas la clause « pas de wasm-bindgen » de
# `docs/construction.md` : celle-ci porte sur ce que la bibliothèque **exporte**
# vers JavaScript, à côté de l'ABI C. Ici rien n'est exporté, c'est un appel.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = [
  "CanvasRenderingContext2d",
  "console",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  "ImageData",
  "Node",
  "Window",
] }

[lints]
workspace = true

# `test = true` fait exécuter le module de test de l'exemple, que Cargo se
# contenterait de compiler. Il est ici et non sur les deux autres exemples parce
# que `hello` est celui que les deux `README` recopient mot pour mot : ce qu'il
# rend est ce qu'un lecteur verra à son premier essai, et il a rendu une fenêtre
# noire pendant toute une livraison sans que rien ne le dise.
[[example]]
name = "hello"
test = true
