# Les méthodes flottantes que le noyau, la frontière et la conformance
# refusent.
#
# Elles appellent la libm, dont les bits changent selon la plateforme, ou ne
# traitent pas NaN et −0 pareil d'un chemin à l'autre. Trigonométrie, racine
# inverse, exponentielle et logarithme passent par les tables et polynômes de
# `src/math`, un minimum ou un maximum s'écrit en comparaison explicite, un
# arrondi sur la conversion `as`.
#
# **La liste est tenue dans les deux largeurs, méthode pour méthode**, et un
# test de la conformance le vérifie. Le noyau n'accède à aucune de ces méthodes
# — elles sont dans `std` —, mais la frontière et la conformance y accèdent, et
# une liste tenue d'un seul côté laisse le chemin ouvert là où une empreinte se
# calcule.
# `abs`, `copysign` et la négation restent permis : ce sont des manipulations
# du bit de signe, exactes partout.
#
# L'étage d'accueil a son propre fichier : ses calculs flottants ne servent
# qu'à l'affichage et n'entrent dans aucune empreinte.
disallowed-methods = [
    { path = "f32::sqrt", reason = "libm : passer par math::rsqrt" },
    { path = "f32::sin", reason = "libm : passer par math::Angle" },
    { path = "f32::cos", reason = "libm : passer par math::Angle" },
    { path = "f32::tan", reason = "libm : passer par math::Angle" },
    { path = "f32::asin", reason = "libm" },
    { path = "f32::acos", reason = "libm" },
    { path = "f32::atan", reason = "libm" },
    { path = "f32::atan2", reason = "libm" },
    { path = "f32::sinh", reason = "libm" },
    { path = "f32::cosh", reason = "libm" },
    { path = "f32::tanh", reason = "libm" },
    { path = "f32::asinh", reason = "libm" },
    { path = "f32::acosh", reason = "libm" },
    { path = "f32::atanh", reason = "libm" },
    { path = "f32::hypot", reason = "libm" },
    { path = "f32::cbrt", reason = "libm" },
    { path = "f32::exp", reason = "libm" },
    { path = "f32::exp2", reason = "libm : passer par math::exp2" },
    { path = "f32::exp_m1", reason = "libm" },
    { path = "f32::ln", reason = "libm" },
    { path = "f32::ln_1p", reason = "libm" },
    { path = "f32::log", reason = "libm : passer par math::exp2" },
    { path = "f32::log2", reason = "libm : passer par math::exp2" },
    { path = "f32::log10", reason = "libm" },
    { path = "f32::powi", reason = "libm selon la cible" },
    { path = "f32::powf", reason = "libm" },
    { path = "f32::mul_add", reason = "fusionne ou appelle la libm selon la cible" },
    { path = "f32::floor", reason = "arrondir sur la conversion as" },
    { path = "f32::ceil", reason = "arrondir sur la conversion as" },
    { path = "f32::round", reason = "arrondir sur la conversion as" },
