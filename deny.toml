# Licences et provenance des dépendances, contrôlées par `make deny`.
#
# Le noyau et la couche FFI n'ont aucune dépendance. Ce qui entre ici vient de
# l'étage d'accueil et de la conformance.

[graph]
all-features = true

[licenses]
# Une licence s'ajoute à la liste avec la dépendance qui l'amène. Une dépendance
# qui voyage dans une archive publiée entre aussi dans THIRD-PARTY-NOTICES, dans
# le même commit ; celles de l'étage d'accueil n'y voyagent pas.
#
# Apache-2.0, ISC et Unicode-3.0 arrivent avec winit et softbuffer.
allow = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les crates du dépôt se référencent par chemin, sans version. Admis parce
# qu'aucun n'est publié sur crates.io.
allow-wildcard-paths = true
# Les versions multiples sous l'étage d'accueil ne concernent pas la
# bibliothèque publiée : les archives ne portent que le noyau et la couche FFI,
# qui n'ont aucune dépendance. Une dizaine d'avertissements en venaient, et du
# bruit permanent finit par masquer celui qui compte.
#
# `skip-tree` n'agit que sur cette section : `advisories` et `cargo audit`
# continuent de parcourir l'arbre entier, vulnérabilités comprises. Écarté :
# `multiple-versions = "deny"` avec des exceptions nommées, qui échangerait ce
# bruit contre une liste à reprendre à chaque montée de ces deux dépendances.
#
# L'étage d'accueil nommé plutôt que ses dépendances : `winit`, `softbuffer` et
# `png` en amenaient chacun, et les énumérer aurait demandé de reprendre cette
# liste à chaque dépendance ajoutée. La racine, elle, dit la règle.
skip-tree = [{ crate = "screengine-play" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
