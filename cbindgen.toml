# Génération de include/screengine.h, par `make header`.
#
# Le header est le contrat que lisent les auteurs de liaisons : sa documentation
# vient des docstrings anglaises de screengine-ffi, et rien ne s'y écrit à la
# main. `make header-verif` refuse tout écart avec le fichier versionné.

language = "C"
include_guard = "SCREENGINE_H"
autogen_warning = "/* Generated by cbindgen from screengine-ffi. Do not edit by hand: run `make header`. */"
header = """/*
 * Copyright 2026 Stéphane Primault <sprimault@users.noreply.github.com>
 * SPDX-License-Identifier: MIT OR Apache-2.0
 */"""

# Les gardes `extern "C"`. Sans elles, un programme C++ qui inclut le header
# cherche des symboles au nom décoré et échoue à l'édition de liens — alors que
# C++ est le langage de la plupart des moteurs et des jeux qui intégreront
# celui-ci.
cpp_compat = true

documentation = true
documentation_style = "c99"

# Ni bool ni types à largeur variable ne traversent la frontière : seules les
# largeurs fixes et size_t sont nécessaires.
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true

# cbindgen analyse la source sans jamais interroger rustc : il ne connaît ni
# taille ni alignement et recopie l'ordre des champs tel qu'il le lit. Or une
# liaison JavaScript écrit la structure octet par octet d'après ces décalages.
# Le compilateur de l'hôte les contrôle donc lui-même, sur sa propre cible, et
# un test `offset_of!` les contrôle côté Rust.
#
# Une seule liste d'assertions, pour C11 et pour C++11. MSVC laisse __cplusplus
# à 199711 sans /Zc:__cplusplus quelle que soit la norme demandée : c'est
# _MSVC_LANG qui la dit.
trailer = """
/* cbindgen place ce bloc après la garde d'inclusion : il lui en faut une. */
#ifndef SCREENGINE_LAYOUT_CHECKED
#define SCREENGINE_LAYOUT_CHECKED
#if defined(__cplusplus) && (__cplusplus >= 201103L || (defined(_MSVC_LANG) && _MSVC_LANG >= 201103L))
#define SCREENGINE_LAYOUT_ASSERT(cond, what) static_assert(cond, what)
#elif !defined(__cplusplus) && defined(__STDC_VERSION__) && __STDC_VERSION__ >= 201112L
#define SCREENGINE_LAYOUT_ASSERT(cond, what) _Static_assert(cond, what)
#endif
#ifdef SCREENGINE_LAYOUT_ASSERT
SCREENGINE_LAYOUT_ASSERT(sizeof(ScgContextConfig) == 32, "ScgContextConfig changed size");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgContextConfig, max_width) == 0, "max_width moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgContextConfig, max_height) == 4, "max_height moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgContextConfig, width) == 8, "width moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgContextConfig, height) == 12, "height moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgContextConfig, tile_size) == 16, "tile_size moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgContextConfig, max_triangles) == 20, "max_triangles moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgContextConfig, reserved1) == 24, "reserved1 moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgContextConfig, reserved2) == 28, "reserved2 moved");
SCREENGINE_LAYOUT_ASSERT(sizeof(ScgVertex) == 12, "ScgVertex changed size");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgVertex, z) == 8, "ScgVertex.z moved");
SCREENGINE_LAYOUT_ASSERT(sizeof(ScgTriangle) == 16, "ScgTriangle changed size");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgTriangle, i2) == 8, "ScgTriangle.i2 moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgTriangle, r) == 12, "ScgTriangle.r moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgTriangle, a) == 15, "ScgTriangle.a moved");
SCREENGINE_LAYOUT_ASSERT(sizeof(ScgCamera) == 36, "ScgCamera changed size");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgCamera, orientation) == 12, "orientation moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgCamera, fov_y) == 28, "fov_y moved");
SCREENGINE_LAYOUT_ASSERT(offsetof(ScgCamera, near_plane) == 32, "near_plane moved");
SCREENGINE_LAYOUT_ASSERT(sizeof(ScgMat4) == 64, "ScgMat4 changed size");
#undef SCREENGINE_LAYOUT_ASSERT
#endif
#endif"""

[parse]
parse_deps = false
