# Le noyau est le paquet racine : src/, tests/, examples/ et benches/ sont les
# siens. La frontière C, l'étage d'accueil et la conformance vivent dans crates/,
# chacun son paquet — les réunir au noyau lui ferait hériter de leurs
# dépendances, de std et de unsafe.
#
# Un `cargo test` tapé à la racine ne teste donc que le noyau. Le Makefile passe
# --workspace ou -p partout, et c'est lui qu'on appelle.
[package]
name = "screengine"
description = "Moteur de rendu 3D logiciel : le noyau, sans std et sans dépendance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Harnais maison : `#[bench]` n'existe qu'en nightly, et le noyau n'a aucune
# dépendance, `dev-dependencies` comprises — donc pas de criterion non plus.
[[bench]]
name = "remplissage"
harness = false

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/screengine-ffi",
    "crates/screengine-lib",
    "crates/screengine-play",
    "crates/screengine-conformance",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sprimault/screengine"
authors = ["Stéphane Primault"]
# Rien ne part sur crates.io tant que l'ABI n'est pas figée : la distribution
# passe par les archives de release. C'est aussi ce qui permet à cargo-deny
# d'admettre les dépendances de chemin sans version.
publish = false

[workspace.dependencies]
screengine = { path = ".", default-features = false }

# Déclarés une fois, hérités par chaque crate avec `lints.workspace = true`. En
# avertissement : `make lint` passe clippy en -D warnings, et un avertissement
# n'arrête pas une compilation en cours d'écriture.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Le rendu logiciel est inutilisable en profil de débogage : on optimise les
# dépendances et le noyau même en dev, sans perdre les assertions.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.screengine]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# La FFI doit rattraper les paniques : `panic = "abort"` y est interdit.
[profile.release-ffi]
inherits = "release"
panic = "unwind"

# La bibliothèque statique contre laquelle `make test-abi` lie l'hôte C. Sans LTO
# complète, qui ferait payer chaque modification du noyau à chaque `make test`.
# Ce n'est pas l'artefact publié, et c'est admissible pour une seule raison :
# l'image ne dépend pas du profil. Une empreinte qui diffère entre ce profil et
# `release-ffi` est un défaut du moteur, pas une raison d'abandonner celui-ci.
[profile.ffi-test]
inherits = "release"
panic = "unwind"
lto = false
codegen-units = 16
incremental = true
debug-assertions = true
overflow-checks = true

# Le module wasm publié. `wasm32-unknown-unknown` ne déroule pas la pile sur une
# chaîne stable : sa bibliothèque standard est précompilée en abort, et le
# `panic = "unwind"` de release-ffi y est ignoré sans avertissement — une panique
# rattrapée par `catch_unwind` finit quand même en trap. Ce profil écrit ce qui
# se passe vraiment, et c'est le crochet de screengine-ffi qui garde le texte.
[profile.release-wasm]
inherits = "release"
panic = "abort"
strip = true

# Le module contre lequel `make test-wasm` lance l'hôte web, pour la même raison
# que ffi-test.
[profile.wasm-test]
inherits = "ffi-test"
panic = "abort"
