[workspace]
resolver = "2"
members = [
    "crates/screengine",
    "crates/screengine-ffi",
    "crates/screengine-host",
    "crates/screengine-conformance",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sprimault/screengine"
authors = ["Stéphane Primault"]
# Rien ne part sur crates.io tant que l'ABI n'est pas figée : la distribution
# passe par les archives de release. C'est aussi ce qui permet à cargo-deny
# d'admettre les dépendances de chemin sans version.
publish = false

[workspace.dependencies]
screengine = { path = "crates/screengine", default-features = false }

# Déclarés une fois, hérités par chaque crate avec `lints.workspace = true`. En
# avertissement : `make lint` passe clippy en -D warnings, et un avertissement
# n'arrête pas une compilation en cours d'écriture.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Le rendu logiciel est inutilisable en profil de débogage : on optimise les
# dépendances et le noyau même en dev, sans perdre les assertions.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.screengine]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# La FFI doit rattraper les paniques : `panic = "abort"` y est interdit.
[profile.release-ffi]
inherits = "release"
panic = "unwind"
