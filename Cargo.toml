# Le noyau est le paquet racine : src/, tests/, examples/ et benches/ sont les
# siens. La frontière C, l'hôte et la conformance vivent dans crates/, chacun son
# paquet — les réunir au noyau lui ferait hériter de leurs dépendances, de std et
# de unsafe.
#
# Un `cargo test` tapé à la racine ne teste donc que le noyau. Le Makefile passe
# --workspace ou -p partout, et c'est lui qu'on appelle.
[package]
name = "screengine"
description = "Moteur de rendu 3D logiciel : le noyau, sans std et sans dépendance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/screengine-ffi",
    "crates/screengine-host",
    "crates/screengine-conformance",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sprimault/screengine"
authors = ["Stéphane Primault"]
# Rien ne part sur crates.io tant que l'ABI n'est pas figée : la distribution
# passe par les archives de release. C'est aussi ce qui permet à cargo-deny
# d'admettre les dépendances de chemin sans version.
publish = false

[workspace.dependencies]
screengine = { path = ".", default-features = false }

# Déclarés une fois, hérités par chaque crate avec `lints.workspace = true`. En
# avertissement : `make lint` passe clippy en -D warnings, et un avertissement
# n'arrête pas une compilation en cours d'écriture.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Le rendu logiciel est inutilisable en profil de débogage : on optimise les
# dépendances et le noyau même en dev, sans perdre les assertions.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.screengine]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# La FFI doit rattraper les paniques : `panic = "abort"` y est interdit.
[profile.release-ffi]
inherits = "release"
panic = "unwind"
